# serves the built app and proxies /backend/* to the Go server, so the browser stays same-origin (the
# Go server has no CORS middleware). "backend" is the in-cluster Service name, the same in every
# environment, so one image works for test and prod
server {
  listen 3000;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/x-icon;

  # sent on every response: a same-origin CSP (the fonts are bundled, the API goes through /backend),
  # no framing (clickjacking of the confirm/delete buttons), no MIME sniffing, only the origin in
  # cross-site referrers, and https pinned. Styles still need 'unsafe-inline' for the <style> tags
  # the UI components inject. A location with its own add_header would stop inheriting these
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location /backend/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    # appends the address this request came from, so the Go server can find the real client behind
    # its TRUSTED_PROXIES. X-Forwarded-Proto passes through from Traefik untouched
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # built file names carry a content hash, so they can be cached for good
  location /assets/ {
    expires 1y;
  }

  # the page itself is always revalidated, so a deploy shows up on the next load
  location = /index.html {
    expires -1;
  }

  # the router runs in the browser: every other path is the app
  location / {
    try_files $uri /index.html;
  }
}

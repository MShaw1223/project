stages:
  - test
  - build
  - package
  - deploy
  - verify

# every job runs on the self-hosted ARM runner on Oracle (infra/oci/runner.tf): it doesn't use the Free
# tier's compute minutes, matches the servers' CPU, and its fixed IP may reach the test environment
default:
  tags:
    - oracle-arm

variables:
  NODE_VERSION: "22"
  TEST_URL: https://fxtrax-test.132-145-29-125.sslip.io
  GO_VERSION: "1.25"
  # npm's download cache, inside the project so the runner can cache it (it only caches paths in there)
  npm_config_cache: $CI_PROJECT_DIR/.npm
  npm_config_prefer_offline: "true"
  npm_config_fund: "false"
  npm_config_update_notifier: "false"

# caches are per job, only where there's something to restore, and keyed on the lockfile so they're
# rebuilt only when dependencies change. npm ci deletes node_modules, so it's npm's download cache
# that is kept. One job writes each cache, the others only read it
.npm-cache:
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - .npm/
    policy: pull

frontend:lint:
  extends: .npm-cache
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend:test:
  extends: .npm-cache
  stage: test
  cache:
    policy: pull-push
  script:
    - cd frontend
    - npm ci
    - npm test

# modules and the compiler's build cache, moved into the project so they can be cached
backend:test:
  image: golang:${GO_VERSION}
  stage: test
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go/build-cache
    GOFLAGS: -modcacherw
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go
    paths:
      - .go/pkg/mod/
      - .go/build-cache/
  script:
    - cd backend
    - go build ./...
    - go test ./...

# on the default branch the image build below runs the same next build, so this is for other branches
frontend:build:
  extends: .npm-cache
  stage: build
  needs:
    - frontend:lint
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    - cd frontend
    - npm ci
    - npm run build

# arm64 images, built natively on the ARM runner: both the Oracle (Ampere) and Hetzner (CAX) servers
# are ARM. The Docker-in-Docker daemon is private to the job, so it's reached without TLS. It starts
# empty every time, so BuildKit's layer cache is kept in the registry (the "buildcache" tag): a
# component whose files haven't changed is not rebuilt
.image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" 2> /dev/null
    - docker buildx create --use
    - >
      docker buildx build --push --provenance=false
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/$COMPONENT:buildcache"
      --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE/$COMPONENT:buildcache,mode=max"
      -t "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_SHORT_SHA" "$COMPONENT"

backend:image:
  extends: .image
  needs:
    - backend:test
  variables:
    COMPONENT: backend

frontend:image:
  extends: .image
  needs:
    - frontend:lint
    - frontend:test
  variables:
    COMPONENT: frontend

# kubectl talking to the test cluster through the GitLab agent (.gitlab/agents/oracle-test), so no
# kubeconfig is stored here
.kubectl:
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  before_script:
    - kubectl config use-context "$CI_PROJECT_PATH:oracle-test"

# SUPABASE_URL and SUPABASE_KEY are protected CI/CD variables scoped to the "test" environment
deploy:test:
  extends: .kubectl
  stage: deploy
  needs:
    - backend:image
    - frontend:image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: test
    url: $TEST_URL
  script:
    - 'sed -i "s/newTag: .*/newTag: $CI_COMMIT_SHORT_SHA/" deploy/overlays/test/kustomization.yaml'
    - kubectl apply -f deploy/overlays/test/namespace.yaml
    - >
      kubectl -n fxtrax create secret generic backend-secrets
      --from-literal=SUPABASE_URL="$SUPABASE_URL" --from-literal=SUPABASE_KEY="$SUPABASE_KEY"
      --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -k deploy/overlays/test
    - kubectl -n fxtrax rollout status deployment/backend --timeout=5m
    - kubectl -n fxtrax rollout status deployment/frontend --timeout=5m

# checks of the deployed test environment from outside, through its firewall: the runner's IP is
# allowed to reach it (infra/oci)
.verify-test:
  stage: verify
  needs:
    - deploy:test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify:smoke:
  extends: .verify-test
  image: node:${NODE_VERSION}-alpine
  variables:
    BASE_URL: $TEST_URL
  script:
    - >
      node --test
      --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=smoke-junit.xml
      deploy/tests/smoke/smoke.test.mjs
  artifacts:
    when: always
    reports:
      junit: smoke-junit.xml

verify:lighthouse:
  extends: .verify-test
  image: node:${NODE_VERSION}-bookworm
  variables:
    BASE_URL: $TEST_URL
    CHROME_PATH: /usr/bin/chromium
    DEBIAN_FRONTEND: noninteractive
    # the deprecation warnings are for Lighthouse CI's own dependencies
    npm_config_loglevel: error
  cache:
    key: lhci-0.15.1
    paths:
      - .npm/
  script:
    # without the recommended packages (systemd, CUPS, polkit...), which Chromium doesn't need headless
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium fonts-liberation > /dev/null
    - npx --yes @lhci/cli@0.15.1 autorun --config=deploy/tests/lighthouse/lighthouserc.cjs
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lighthouse-reports/

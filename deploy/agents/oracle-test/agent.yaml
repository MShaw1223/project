# installed by k3s's built-in Helm controller; the agent dials out to GitLab, so the cluster needs no
# inbound port for CI. What CI may do is set in .gitlab/agents/oracle-test/config.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: gitlab-agent
  namespace: kube-system
spec:
  repo: https://charts.gitlab.io
  chart: gitlab-agent
  version: 2.32.0
  targetNamespace: gitlab-agent
  valuesContent: |-
    # one is plenty on a single small node (the chart defaults to two)
    replicas: 1
    config:
      kasAddress: wss://kas.gitlab.com
      secretName: gitlab-agent-token
